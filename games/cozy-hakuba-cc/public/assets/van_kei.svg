<svg xmlns="http://www.w3.org/2000/svg" width="240" height="150" viewBox="0 0 240 150">
  <!-- Starter Kei Van, side view. Cream body + teal stripe; roof rack shows "upgradable" -->
  <ellipse cx="120" cy="140" rx="104" ry="8" fill="#3b3a4a" opacity="0.18"/>
  <path d="M28 128 V52 Q28 30 50 30 H176 Q196 30 206 50 L222 86 Q226 94 226 104 V128Z" fill="#efe3c2" stroke="#3b3a4a" stroke-width="3" stroke-linejoin="round"/>
  <rect x="28" y="92" width="198" height="12" fill="#4f8f8a"/>
  <!-- windshield + side windows -->
  <path d="M178 40 H186 Q196 40 202 54 L214 82 H178Z" fill="#cfe0ee" stroke="#3b3a4a" stroke-width="3" stroke-linejoin="round"/>
  <rect x="42" y="42" width="56" height="38" rx="6" fill="#cfe0ee" stroke="#3b3a4a" stroke-width="3"/>
  <rect x="108" y="42" width="58" height="38" rx="6" fill="#cfe0ee" stroke="#3b3a4a" stroke-width="3"/>
  <!-- serving hatch hint (business) -->
  <path d="M108 42 h58 v-6 h-58Z" fill="#c8553d"/>
  <!-- roof rack -->
  <g stroke="#3b3a4a" stroke-width="3" stroke-linecap="round"><line x1="44" y1="22" x2="170" y2="22"/><line x1="56" y1="22" x2="56" y2="30"/><line x1="158" y1="22" x2="158" y2="30"/></g>
  <!-- wheels -->
  <g stroke="#3b3a4a" stroke-width="3"><circle cx="66" cy="128" r="17" fill="#3b3a4a"/><circle cx="186" cy="128" r="17" fill="#3b3a4a"/></g>
  <g fill="#cfc8bd"><circle cx="66" cy="128" r="7"/><circle cx="186" cy="128" r="7"/></g>
  <circle cx="220" cy="106" r="4" fill="#f2a541" stroke="#3b3a4a" stroke-width="2"/>
</svg>
