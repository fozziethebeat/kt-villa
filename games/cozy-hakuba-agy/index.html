<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cozy Hakuba — Van Life &amp; Village Restoration</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="top-hud">
      <div class="hud-left">
        <div class="brand-stamp">
          <span class="brand-jp">白馬</span>
          <h1>Cozy Hakuba</h1>
        </div>
        <span id="hud-season-badge" class="season-pill winter">❄️ Winter · ●○○○○○</span>
      </div>

      <div class="hud-center">
        <span id="hud-region-title" class="region-pill">1. Hakuba Train Station</span>
        <span id="hud-vitality" class="vitality-pill">❄️ 35% · 🌱 15%</span>
      </div>

      <div class="hud-right">
        <span class="stat-pill yen" id="hud-yen">¥520</span>
        <span class="stat-pill" id="hud-cozy">☕ 100/125</span>
        <span class="stat-pill player" id="hud-player">Yuki</span>
      </div>
    </header>

    <main class="workspace-shell">
      <section class="canvas-stage" aria-label="Hakuba Overworld Diorama">
        <div id="phaser-container"></div>
        <div id="cozy-toast" class="cozy-toast" role="status" aria-live="polite"></div>
      </section>

      <aside class="bottom-dock" aria-label="Quest Stamps &amp; Travel Actions">
        <div id="hud-quest-summary" class="stamp-strip"></div>

        <nav class="dock-actions" aria-label="Van &amp; Valley Actions">
          <button type="button" id="btn-open-van" class="dock-btn primary">
            <span aria-hidden="true">🚐</span>
            <span>Van Studio</span>
          </button>
          <button type="button" id="btn-open-steward" class="dock-btn">
            <span aria-hidden="true">🏮</span>
            <span>Steward</span>
          </button>
          <button type="button" id="btn-open-atlas" class="dock-btn">
            <span aria-hidden="true">🗺️</span>
            <span>Valley Map</span>
          </button>
          <button type="button" id="btn-advance-day" class="dock-btn">
            <span aria-hidden="true">🌙</span>
            <span>Next Day</span>
          </button>
        </nav>
      </aside>
    </main>

    <!-- 1. Character & Personality Selection ("Tokyo -> Hakuba Express Ticket") -->
    <dialog id="dialog-char-select" aria-labelledby="title-char-select">
      <div class="dialog-header ticket-header">
        <div class="ticket-title-group">
          <span class="ticket-badge">東京 → 白馬 • OITO LINE PASS</span>
          <h2 id="title-char-select">Start Your Hakuba Van Life</h2>
        </div>
      </div>
      <div id="char-select-body" class="dialog-content"></div>
    </dialog>

    <!-- 2. Modular Van Interior Cutaway & Business Shop -->
    <dialog id="dialog-van-interior" aria-labelledby="title-van-interior">
      <div class="dialog-header">
        <h2 id="title-van-interior">🚐 Camper Van Studio</h2>
        <form method="dialog">
          <button type="submit" value="close" class="close-btn" aria-label="Close Van Studio">✕</button>
        </form>
      </div>
      <div id="van-interior-body" class="dialog-content"></div>
    </dialog>

    <!-- 3. Tactile Pop-Up Service Mini-Game -->
    <dialog id="dialog-service-minigame" aria-labelledby="title-service-minigame">
      <div class="dialog-header">
        <h2 id="title-service-minigame">☕ Pop-Up Window Service</h2>
        <form method="dialog">
          <button type="submit" value="close" class="close-btn" aria-label="Close Service Window">✕</button>
        </form>
      </div>
      <div id="service-minigame-body" class="dialog-content"></div>
    </dialog>

    <!-- 4. Regional Steward Dialogue & Green Pivot -->
    <dialog id="dialog-steward" aria-labelledby="title-steward">
      <div class="dialog-header">
        <h2 id="title-steward">🏮 Regional Steward</h2>
        <form method="dialog">
          <button type="submit" value="close" class="close-btn" aria-label="Close Steward">✕</button>
        </form>
      </div>
      <div id="steward-modal-body" class="dialog-content"></div>
    </dialog>

    <!-- 5. Regional Restoration Puzzle -->
    <dialog id="dialog-puzzle" aria-labelledby="title-puzzle">
      <div class="dialog-header">
        <h2 id="title-puzzle">⚙️ Village Restoration</h2>
        <form method="dialog">
          <button type="submit" value="close" class="close-btn" aria-label="Close Puzzle">✕</button>
        </form>
      </div>
      <div id="puzzle-modal-body" class="dialog-content"></div>
    </dialog>

    <!-- 6. Hakuba Valley 10-Region Atlas -->
    <dialog id="dialog-valley-atlas" aria-labelledby="title-valley-atlas">
      <div class="dialog-header">
        <h2 id="title-valley-atlas">🗺️ Hakuba Valley Guidebook (10 Regions)</h2>
        <form method="dialog">
          <button type="submit" value="close" class="close-btn" aria-label="Close Atlas">✕</button>
        </form>
      </div>
      <div id="valley-atlas-body" class="dialog-content"></div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
